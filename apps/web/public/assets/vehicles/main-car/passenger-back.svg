<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- PLACEHOLDER: passenger_back — 3/4 angle from passenger's side, rear face -->
  <!-- Camera is to the RIGHT of the vehicle, looking at the rear face.         -->
  <!-- Left side of rear is more prominent; right is compressed/farther.        -->
  <!-- Mirror geometry of driver-back.                                           -->
  <!-- Replace with real photorealistic PNG/WebP. See docs/ASSET_RENDERER_STRATEGY.md -->

  <!-- Car body — trapezoidal rear: right side compressed, left fuller -->
  <polygon points="8,72 5,68 2,56 1,44 2,32 6,20 12,10 18,4 45,2 80,5 84,12 90,26 93,40 92,52 90,66 86,72"
           fill="#5a1818"/>
  <!-- Trunk lid -->
  <polygon points="12,12 84,10 81,24 15,22" fill="#481010"/>
  <!-- Roof -->
  <polygon points="18,4 80,5 83,13 14,12" fill="#200808"/>
  <!-- Rear window -->
  <polygon points="20,4 78,5 82,13 16,12" fill="#0a0408" opacity="0.95"/>

  <!-- Third brake light -->
  <rect x="28" y="21" width="44" height="3" rx="1" fill="#ef4444" opacity="0.8"/>

  <!-- Left tail light — larger (closer to camera) -->
  <rect x="1"  y="32" width="19" height="15" rx="2" fill="#7f1212" opacity="0.92"/>
  <rect x="2"  y="33" width="17" height="3" rx="1" fill="#ef4444" opacity="0.9"/>
  <circle cx="10" cy="42" r="6"   fill="#ef4444" opacity="0.65"/>
  <circle cx="10" cy="42" r="3.2" fill="#ef4444" opacity="0.9"/>
  <!-- Right tail light — smaller (farther) -->
  <rect x="77" y="34" width="16" height="14" rx="2" fill="#7f1212" opacity="0.75"/>
  <rect x="78" y="35" width="14" height="2.5" rx="1" fill="#ef4444" opacity="0.7"/>
  <circle cx="85" cy="43" r="4.5" fill="#ef4444" opacity="0.55"/>

  <!-- Rear fascia -->
  <rect x="26" y="34" width="50" height="14" rx="1.5" fill="#3a1212"/>
  <line x1="26" y1="34" x2="76" y2="34" stroke="#8a2020" stroke-width="1.2"/>

  <!-- Rear bumper -->
  <polygon points="7,49 91,50 91,71 5,70" fill="#2a1010"/>
  <!-- Left exhaust larger -->
  <ellipse cx="15" cy="62" rx="5"   ry="4" fill="#1a1a1a"/>
  <ellipse cx="15" cy="62" rx="3.2" ry="2.6" fill="#222"/>
  <!-- Right exhaust smaller -->
  <ellipse cx="87" cy="62" rx="3.5" ry="3" fill="#1a1a1a"/>
  <ellipse cx="87" cy="62" rx="2"   ry="1.8" fill="#222"/>

  <!-- Plate area — slightly left (xPct=0.30 for passenger_back anchor) -->
  <rect x="30" y="54.7" width="38" height="12.5" rx="1.5"
        fill="rgba(40,14,14,0.6)"
        stroke="#e0c000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Passenger-side body panel hint (right edge) -->
  <line x1="91" y1="26" x2="91" y2="68" stroke="rgba(200,100,100,0.25)" stroke-width="1"/>

  <!-- Wheels — right smaller, left larger -->
  <ellipse cx="13"  cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="13"  cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="13"  cy="72" rx="5"  ry="2" fill="#333"/>
  <ellipse cx="85"  cy="72" rx="11" ry="4" fill="#090909"/>
  <ellipse cx="85"  cy="72" rx="7"  ry="2.8" fill="#1a1a1a"/>
  <ellipse cx="85"  cy="72" rx="4"  ry="1.7" fill="#333"/>

  <!-- Placeholder label -->
  <text x="50" y="11" text-anchor="middle" font-size="3.8" font-family="monospace" font-weight="bold"
        fill="#ff8c00" opacity="0.9">PLACEHOLDER</text>
  <text x="50" y="25" text-anchor="middle" font-size="3.2" font-family="monospace"
        fill="#ffcc44" opacity="0.8">PASSENGER BACK</text>

  <!-- View indicator: from rear-right -->
  <path d="M 97,10 L 94,7 L 94,9 L 91,9 L 91,11 L 94,11 L 94,13 Z" fill="#ff9999" opacity="0.7"/>
  <text x="96" y="6" text-anchor="middle" font-size="2.8" font-family="monospace" fill="#ff9999" opacity="0.7">PB</text>
</svg>
