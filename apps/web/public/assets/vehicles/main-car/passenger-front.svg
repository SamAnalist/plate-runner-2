<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- PLACEHOLDER: passenger_front — 3/4 angle from passenger's side (front-right) -->
  <!-- Camera is to the RIGHT of the vehicle, looking at the front face.        -->
  <!-- Right side of car is farther away → left side more prominent.            -->
  <!-- Mirror geometry of driver-front.                                         -->
  <!-- Replace with real photorealistic PNG/WebP. See docs/ASSET_RENDERER_STRATEGY.md -->

  <!-- Car body — trapezoidal: right side compressed, left fuller -->
  <polygon points="8,72 5,68 2,56 1,44 2,32 6,20 12,10 18,4 45,2 80,5 84,12 90,26 93,40 92,52 90,66 86,72"
           fill="#1e3a60"/>
  <!-- Hood -->
  <polygon points="12,12 84,10 81,24 15,22" fill="#172e50"/>
  <!-- Roof — right edge higher -->
  <polygon points="18,4 80,5 83,13 14,12" fill="#0f1a30"/>
  <!-- Windshield -->
  <polygon points="20,4 78,5 82,13 16,12" fill="#0a1428" opacity="0.95"/>

  <!-- Left headlight — larger (closer, passenger side = left in this image) -->
  <rect x="1" y="32" width="19" height="15" rx="2" fill="#c8c090" opacity="0.9"/>
  <rect x="2" y="33" width="17" height="3" rx="1" fill="white" opacity="0.75"/>
  <circle cx="10" cy="42" r="6.5" fill="white" opacity="0.55"/>
  <!-- Right headlight — smaller (farther) -->
  <rect x="77" y="34" width="16" height="14" rx="2" fill="#c8c090" opacity="0.7"/>
  <rect x="78" y="35" width="14" height="2.5" rx="1" fill="white" opacity="0.55"/>
  <circle cx="85" cy="43" r="5" fill="white" opacity="0.4"/>

  <!-- Grille -->
  <rect x="26" y="34" width="50" height="14" rx="2" fill="#0a0a0a"/>
  <line x1="27" y1="38" x2="75" y2="38" stroke="#222" stroke-width="0.8"/>
  <line x1="27" y1="42" x2="75" y2="42" stroke="#222" stroke-width="0.8"/>

  <!-- Front bumper -->
  <polygon points="7,49 91,50 91,71 5,70" fill="#171c24"/>
  <!-- Left air duct larger -->
  <rect x="5"  y="53" width="19" height="10" rx="1.5" fill="#080808"/>
  <!-- Right air duct smaller -->
  <rect x="75" y="54" width="16" height="9" rx="1.5" fill="#080808"/>

  <!-- Plate area — slightly left of centre (xPct=0.30 for passenger_front anchor) -->
  <rect x="30" y="54.7" width="38" height="12.5" rx="1.5"
        fill="rgba(18,28,45,0.6)"
        stroke="#e0c000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Right passenger-side door hint -->
  <line x1="91" y1="26" x2="91" y2="68" stroke="rgba(100,150,200,0.25)" stroke-width="1"/>

  <!-- Wheels — right smaller, left larger -->
  <ellipse cx="13"  cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="13"  cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="13"  cy="72" rx="5"  ry="2" fill="#333"/>
  <ellipse cx="85"  cy="72" rx="11" ry="4" fill="#090909"/>
  <ellipse cx="85"  cy="72" rx="7"  ry="2.8" fill="#1a1a1a"/>
  <ellipse cx="85"  cy="72" rx="4"  ry="1.7" fill="#333"/>

  <!-- Placeholder label -->
  <text x="50" y="11" text-anchor="middle" font-size="3.8" font-family="monospace" font-weight="bold"
        fill="#ff8c00" opacity="0.9">PLACEHOLDER</text>
  <text x="50" y="25" text-anchor="middle" font-size="3.2" font-family="monospace"
        fill="#ffcc44" opacity="0.8">PASSENGER FRONT</text>

  <!-- View indicator: arrow from front-right -->
  <path d="M 97,10 L 94,7 L 94,9 L 91,9 L 91,11 L 94,11 L 94,13 Z" fill="#66ccff" opacity="0.7"/>
  <text x="96" y="6" text-anchor="middle" font-size="2.8" font-family="monospace" fill="#66ccff" opacity="0.7">PF</text>
</svg>
