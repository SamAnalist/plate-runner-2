<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- PLACEHOLDER: center_front — straight-on frontal view -->
  <!-- Replace with real photorealistic PNG/WebP. See docs/ASSET_RENDERER_STRATEGY.md -->

  <!-- Car body — symmetric, full-width frontal silhouette -->
  <path d="M 8,72 L 4,67 L 1,54 L 0,44 L 3,30 L 10,18 L 16,8 L 20,3 Q 50,-1 80,3 L 84,8 L 90,18 L 97,30 L 100,44 L 99,54 L 96,67 L 92,72 Z"
        fill="#2a3a6a" />
  <!-- Hood -->
  <path d="M 10,18 L 90,18 L 86,26 L 14,26 Z" fill="#1e2e56" />
  <!-- Roof -->
  <path d="M 16,8 L 84,8 L 88,18 L 12,18 Z" fill="#121a30" />
  <!-- Windshield -->
  <path d="M 20,4 L 80,4 L 84,17 L 16,17 Z" fill="#0a1428" opacity="0.95" />

  <!-- Left headlight -->
  <rect x="2" y="32" width="24" height="15" rx="2" fill="#c8c090" opacity="0.85"/>
  <rect x="3" y="33" width="22" height="3" rx="1" fill="white" opacity="0.7"/>
  <circle cx="13" cy="42" r="6" fill="white" opacity="0.5"/>
  <!-- Right headlight (symmetric) -->
  <rect x="74" y="32" width="24" height="15" rx="2" fill="#c8c090" opacity="0.85"/>
  <rect x="75" y="33" width="22" height="3" rx="1" fill="white" opacity="0.7"/>
  <circle cx="87" cy="42" r="6" fill="white" opacity="0.5"/>

  <!-- Grille -->
  <rect x="27" y="32" width="46" height="16" rx="2" fill="#0a0a0a"/>
  <line x1="28" y1="36" x2="72" y2="36" stroke="#222" stroke-width="0.8"/>
  <line x1="28" y1="40" x2="72" y2="40" stroke="#222" stroke-width="0.8"/>
  <line x1="28" y1="44" x2="72" y2="44" stroke="#222" stroke-width="0.8"/>

  <!-- Front bumper -->
  <rect x="0" y="49" width="100" height="21" rx="2" fill="#1a1e26"/>
  <rect x="4" y="53" width="20" height="10" rx="1.5" fill="#090909"/>
  <rect x="76" y="53" width="20" height="10" rx="1.5" fill="#090909"/>

  <!-- Plate area (NO plate content — overlay handles this) -->
  <!-- Yellow dashed outline shows where DynamicPlateOverlay lands -->
  <rect x="29" y="54" width="42" height="13" rx="1.5"
        fill="rgba(20,30,50,0.6)"
        stroke="#e0c000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Wheels -->
  <ellipse cx="13" cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="13" cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="13" cy="72" rx="5"  ry="2" fill="#333"/>
  <ellipse cx="87" cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="87" cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="87" cy="72" rx="5"  ry="2" fill="#333"/>

  <!-- Placeholder label -->
  <text x="50" y="11" text-anchor="middle" font-size="3.8" font-family="monospace" font-weight="bold"
        fill="#ff8c00" opacity="0.9">PLACEHOLDER</text>
  <text x="50" y="24" text-anchor="middle" font-size="3.2" font-family="monospace"
        fill="#ffcc44" opacity="0.8">CENTER FRONT</text>

  <!-- View direction indicator: straight arrow (camera is centred, front) -->
  <path d="M 94,6 L 97,6 L 97,3 L 100,6 L 97,9 L 97,6" fill="#44aaff" opacity="0.7"/>
  <text x="90" y="5" text-anchor="end" font-size="2.8" font-family="monospace" fill="#44aaff" opacity="0.7">CF</text>
</svg>
