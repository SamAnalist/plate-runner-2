<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- PLACEHOLDER: driver_front — 3/4 angle from driver's side (front-left) -->
  <!-- Camera is to the LEFT of the vehicle, looking at the front face.       -->
  <!-- Left side of car is farther away → right side more prominent.          -->
  <!-- Replace with real photorealistic PNG/WebP. See docs/ASSET_RENDERER_STRATEGY.md -->

  <!-- Car body — trapezoidal: left side compressed (farther), right side fuller -->
  <polygon points="14,72 10,66 8,52 7,40 10,26 16,12 20,5 55,2 82,4 88,10 94,20 98,32 99,44 98,56 95,68 92,72"
           fill="#1e3a60"/>
  <!-- Hood — angled to show 3/4 perspective: narrower on left -->
  <polygon points="16,12 88,10 85,22 19,24" fill="#172e50"/>
  <!-- Roof — left edge higher (farther from camera) -->
  <polygon points="20,5 82,4 86,12 17,13" fill="#0f1a30"/>
  <!-- Windshield — left edge narrowed -->
  <polygon points="22,5 80,4 84,12 18,13" fill="#0a1428" opacity="0.95"/>

  <!-- Left headlight — smaller (farther, driver side is right in this image) -->
  <rect x="7" y="34" width="16" height="14" rx="2" fill="#c8c090" opacity="0.7"/>
  <rect x="8" y="35" width="14" height="2.5" rx="1" fill="white" opacity="0.55"/>
  <circle cx="15" cy="43" r="5" fill="white" opacity="0.4"/>
  <!-- Right headlight — larger (closer to camera) -->
  <rect x="80" y="32" width="19" height="15" rx="2" fill="#c8c090" opacity="0.9"/>
  <rect x="81" y="33" width="17" height="3" rx="1" fill="white" opacity="0.75"/>
  <circle cx="90" cy="42" r="6.5" fill="white" opacity="0.55"/>

  <!-- Grille — shifted right in 3/4 perspective -->
  <rect x="24" y="34" width="50" height="14" rx="2" fill="#0a0a0a"/>
  <line x1="25" y1="38" x2="73" y2="38" stroke="#222" stroke-width="0.8"/>
  <line x1="25" y1="42" x2="73" y2="42" stroke="#222" stroke-width="0.8"/>

  <!-- Front bumper -->
  <polygon points="7,50 93,49 95,70 9,71" fill="#171c24"/>
  <!-- Left air duct smaller -->
  <rect x="9"  y="54" width="16" height="9" rx="1.5" fill="#080808"/>
  <!-- Right air duct larger/closer -->
  <rect x="76" y="53" width="19" height="10" rx="1.5" fill="#080808"/>

  <!-- Plate area — slightly right of centre in this 3/4 view, matching DRIVER_FRONT anchor (xPct=0.32) -->
  <rect x="32" y="54.7" width="38" height="12.5" rx="1.5"
        fill="rgba(18,28,45,0.6)"
        stroke="#e0c000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Left driver-side door / body panel hint -->
  <line x1="8" y1="26" x2="9" y2="68" stroke="rgba(100,150,200,0.25)" stroke-width="1"/>

  <!-- Wheels — left smaller (farther), right larger -->
  <ellipse cx="15" cy="72" rx="11" ry="4" fill="#090909"/>
  <ellipse cx="15" cy="72" rx="7"  ry="2.8" fill="#1a1a1a"/>
  <ellipse cx="15" cy="72" rx="4"  ry="1.7" fill="#333"/>
  <ellipse cx="87" cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="87" cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="87" cy="72" rx="5"  ry="2" fill="#333"/>

  <!-- Placeholder label -->
  <text x="50" y="11" text-anchor="middle" font-size="3.8" font-family="monospace" font-weight="bold"
        fill="#ff8c00" opacity="0.9">PLACEHOLDER</text>
  <text x="50" y="25" text-anchor="middle" font-size="3.2" font-family="monospace"
        fill="#ffcc44" opacity="0.8">DRIVER FRONT</text>

  <!-- View indicator: arrow from front-left -->
  <path d="M 3,10 L 6,7 L 6,9 L 9,9 L 9,11 L 6,11 L 6,13 Z" fill="#66ccff" opacity="0.7"/>
  <text x="4" y="6" text-anchor="middle" font-size="2.8" font-family="monospace" fill="#66ccff" opacity="0.7">DF</text>
</svg>
