<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- PLACEHOLDER: center_back — straight-on rear view -->
  <!-- Camera is centred behind the vehicle, looking at the rear face.  -->
  <!-- Replace with real photorealistic PNG/WebP. See docs/ASSET_RENDERER_STRATEGY.md -->

  <!-- Car body — symmetric rear silhouette -->
  <path d="M 8,72 L 4,67 L 1,54 L 0,44 L 3,30 L 10,18 L 16,8 L 20,3 Q 50,-1 80,3 L 84,8 L 90,18 L 97,30 L 100,44 L 99,54 L 96,67 L 92,72 Z"
        fill="#5a1818"/>
  <!-- Trunk lid -->
  <path d="M 10,18 L 90,18 L 86,26 L 14,26 Z" fill="#481010"/>
  <!-- Roof -->
  <path d="M 16,8 L 84,8 L 88,18 L 12,18 Z" fill="#200808"/>
  <!-- Rear window -->
  <path d="M 20,4 L 80,4 L 84,17 L 16,17 Z" fill="#0a0408" opacity="0.95"/>

  <!-- Third brake light strip -->
  <rect x="32" y="21" width="36" height="3" rx="1" fill="#ef4444" opacity="0.85"/>

  <!-- Left tail light -->
  <rect x="2"  y="32" width="24" height="15" rx="2" fill="#7f1212" opacity="0.9"/>
  <rect x="3"  y="33" width="22" height="2.5" rx="1" fill="#ef4444" opacity="0.85"/>
  <circle cx="13" cy="41" r="5.5" fill="#ef4444" opacity="0.6"/>
  <circle cx="13" cy="41" r="3"   fill="#ef4444" opacity="0.9"/>
  <!-- Right tail light (symmetric) -->
  <rect x="74" y="32" width="24" height="15" rx="2" fill="#7f1212" opacity="0.9"/>
  <rect x="75" y="33" width="22" height="2.5" rx="1" fill="#ef4444" opacity="0.85"/>
  <circle cx="87" cy="41" r="5.5" fill="#ef4444" opacity="0.6"/>
  <circle cx="87" cy="41" r="3"   fill="#ef4444" opacity="0.9"/>

  <!-- Rear fascia / boot area -->
  <rect x="27" y="32" width="46" height="16" rx="1.5" fill="#3a1212"/>
  <line x1="27" y1="32" x2="73" y2="32" stroke="#8a2020" stroke-width="1.2"/>
  <!-- Badge -->
  <rect x="44" y="37" width="12" height="4" rx="1" fill="#2a0808" opacity="0.6"/>

  <!-- Rear bumper -->
  <rect x="0" y="49" width="100" height="21" rx="2" fill="#2a1010"/>
  <!-- Diffuser -->
  <rect x="26" y="56" width="48" height="8" rx="1" fill="#111"/>
  <line x1="32" y1="56" x2="32" y2="64" stroke="#252525" stroke-width="0.7"/>
  <line x1="40" y1="56" x2="40" y2="64" stroke="#252525" stroke-width="0.7"/>
  <line x1="50" y1="56" x2="50" y2="64" stroke="#252525" stroke-width="0.7"/>
  <line x1="60" y1="56" x2="60" y2="64" stroke="#252525" stroke-width="0.7"/>
  <line x1="68" y1="56" x2="68" y2="64" stroke="#252525" stroke-width="0.7"/>
  <!-- Exhaust pipes -->
  <ellipse cx="16" cy="62" rx="5" ry="4" fill="#1a1a1a"/>
  <ellipse cx="16" cy="62" rx="3" ry="2.5" fill="#222"/>
  <ellipse cx="84" cy="62" rx="5" ry="4" fill="#1a1a1a"/>
  <ellipse cx="84" cy="62" rx="3" ry="2.5" fill="#222"/>

  <!-- Plate area (symmetric) -->
  <rect x="29" y="54" width="42" height="13" rx="1.5"
        fill="rgba(40,14,14,0.6)"
        stroke="#e0c000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Wheels -->
  <ellipse cx="13" cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="13" cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="13" cy="72" rx="5"  ry="2" fill="#333"/>
  <ellipse cx="87" cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="87" cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="87" cy="72" rx="5"  ry="2" fill="#333"/>

  <!-- Placeholder label -->
  <text x="50" y="11" text-anchor="middle" font-size="3.8" font-family="monospace" font-weight="bold"
        fill="#ff8c00" opacity="0.9">PLACEHOLDER</text>
  <text x="50" y="24" text-anchor="middle" font-size="3.2" font-family="monospace"
        fill="#ffcc44" opacity="0.8">CENTER BACK</text>

  <!-- View indicator -->
  <path d="M 94,6 L 97,6 L 97,3 L 100,6 L 97,9 L 97,6" fill="#ff6666" opacity="0.7"/>
  <text x="90" y="5" text-anchor="end" font-size="2.8" font-family="monospace" fill="#ff6666" opacity="0.7">CB</text>
</svg>
