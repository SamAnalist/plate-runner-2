<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72">
  <!-- PLACEHOLDER: driver_back — 3/4 angle from driver's side, rear face -->
  <!-- Camera is to the LEFT of the vehicle, looking at the rear face.   -->
  <!-- Right side of rear is more prominent; left is compressed/farther. -->
  <!-- Replace with real photorealistic PNG/WebP. See docs/ASSET_RENDERER_STRATEGY.md -->

  <!-- Car body — trapezoidal rear: left side compressed, right fuller -->
  <polygon points="14,72 10,66 8,52 7,40 10,26 16,12 20,5 55,2 82,4 88,10 94,20 98,32 99,44 98,56 95,68 92,72"
           fill="#5a1818"/>
  <!-- Trunk lid -->
  <polygon points="16,12 88,10 85,22 19,24" fill="#481010"/>
  <!-- Roof -->
  <polygon points="20,5 82,4 86,12 17,13" fill="#200808"/>
  <!-- Rear window -->
  <polygon points="22,5 80,4 84,12 18,13" fill="#0a0408" opacity="0.95"/>

  <!-- Third brake light -->
  <rect x="26" y="21" width="46" height="3" rx="1" fill="#ef4444" opacity="0.8"/>

  <!-- Left tail light — smaller (farther) -->
  <rect x="7"  y="34" width="16" height="14" rx="2" fill="#7f1212" opacity="0.75"/>
  <rect x="8"  y="35" width="14" height="2.5" rx="1" fill="#ef4444" opacity="0.7"/>
  <circle cx="15" cy="43" r="4.5" fill="#ef4444" opacity="0.55"/>
  <!-- Right tail light — larger (closer to camera) -->
  <rect x="80" y="32" width="19" height="15" rx="2" fill="#7f1212" opacity="0.92"/>
  <rect x="81" y="33" width="17" height="3" rx="1" fill="#ef4444" opacity="0.9"/>
  <circle cx="90" cy="42" r="6"   fill="#ef4444" opacity="0.65"/>
  <circle cx="90" cy="42" r="3.2" fill="#ef4444" opacity="0.9"/>

  <!-- Rear fascia — shifted right in 3/4 -->
  <rect x="24" y="34" width="50" height="14" rx="1.5" fill="#3a1212"/>
  <line x1="24" y1="34" x2="74" y2="34" stroke="#8a2020" stroke-width="1.2"/>

  <!-- Rear bumper -->
  <polygon points="7,50 93,49 95,70 9,71" fill="#2a1010"/>
  <!-- Left exhaust smaller -->
  <ellipse cx="13" cy="62" rx="3.5" ry="3" fill="#1a1a1a"/>
  <ellipse cx="13" cy="62" rx="2"   ry="1.8" fill="#222"/>
  <!-- Right exhaust larger -->
  <ellipse cx="85" cy="62" rx="5"   ry="4" fill="#1a1a1a"/>
  <ellipse cx="85" cy="62" rx="3.2" ry="2.6" fill="#222"/>

  <!-- Plate area — slightly right (xPct=0.32 for driver_back anchor) -->
  <rect x="32" y="54.7" width="38" height="12.5" rx="1.5"
        fill="rgba(40,14,14,0.6)"
        stroke="#e0c000" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Driver-side body panel hint (left edge) -->
  <line x1="8" y1="26" x2="9" y2="68" stroke="rgba(200,100,100,0.25)" stroke-width="1"/>

  <!-- Wheels — left smaller, right larger -->
  <ellipse cx="15" cy="72" rx="11" ry="4" fill="#090909"/>
  <ellipse cx="15" cy="72" rx="7"  ry="2.8" fill="#1a1a1a"/>
  <ellipse cx="15" cy="72" rx="4"  ry="1.7" fill="#333"/>
  <ellipse cx="87" cy="72" rx="13" ry="5" fill="#090909"/>
  <ellipse cx="87" cy="72" rx="9"  ry="3.5" fill="#1a1a1a"/>
  <ellipse cx="87" cy="72" rx="5"  ry="2" fill="#333"/>

  <!-- Placeholder label -->
  <text x="50" y="11" text-anchor="middle" font-size="3.8" font-family="monospace" font-weight="bold"
        fill="#ff8c00" opacity="0.9">PLACEHOLDER</text>
  <text x="50" y="25" text-anchor="middle" font-size="3.2" font-family="monospace"
        fill="#ffcc44" opacity="0.8">DRIVER BACK</text>

  <!-- View indicator: from rear-left -->
  <path d="M 3,10 L 6,7 L 6,9 L 9,9 L 9,11 L 6,11 L 6,13 Z" fill="#ff9999" opacity="0.7"/>
  <text x="4" y="6" text-anchor="middle" font-size="2.8" font-family="monospace" fill="#ff9999" opacity="0.7">DB</text>
</svg>
