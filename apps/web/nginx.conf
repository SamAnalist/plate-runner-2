# Plate Runner web — static asset server with baseline security headers.
# The API Base URL is user-configurable at runtime (Settings / API), so
# connect-src is deliberately permissive rather than pinned to one origin —
# locking it down would break "point this frontend at any backend" by
# design. See docs/SECURITY_AUDIT_RAILWAY_READINESS.md for the tradeoff.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
